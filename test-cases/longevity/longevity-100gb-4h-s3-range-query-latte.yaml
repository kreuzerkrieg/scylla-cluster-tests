test_duration: 720

n_db_nodes: 6
n_loaders: 1
seeds_num: 3
simulated_racks: 3

instance_type_db: 'i4i.xlarge'

nemesis_class_name: 'NoOpMonkey'

user_prefix: 'longevity-s3-range'
space_node_threshold: 64424

server_encrypt: false
client_encrypt: false
enterprise_disable_kms: true
stop_test_on_stress_failure: false

sstable_size: 100

hinted_handoff: 'enabled'
parallel_node_operations: true

append_scylla_yaml:
  write_request_timeout_in_ms: 4800000
  read_request_timeout_in_ms: 4800000
  range_request_timeout_in_ms: 4800000
  object_storage_connections_per_shard: 512
  query_page_size_in_bytes: 67108864

prepare_write_cmd:
  - >-
    latte run --function=insert --tag=latte-s3-write --consistency=ALL --threads=2 --concurrency=24
    --duration=40000000 --start-cycle=1 --end-cycle=40000001
    --request-timeout=300 --retry-interval='2s,10s' --retry-number=10
    data_dir/latte/s3_range_query.rn

stress_cmd:
  - >-
    latte run --function=multi_pk_read --tag=latte-s3-multi_pk_read --consistency=QUORUM --threads=1 --concurrency=24
    --duration=60m --start-cycle=1 --end-cycle=40000001
    --request-timeout=4800
    data_dir/latte/s3_range_query.rn
  - >-
    latte run --function=range_read --tag=latte-s3-range_read --consistency=QUORUM --threads=1 --concurrency=24
    --duration=24
    --request-timeout=14800
    data_dir/latte/s3_range_query.rn
  - >-
    latte run --function=count_read --tag=latte-s3-count_read --consistency=QUORUM --threads=1 --concurrency=24
    --duration=1
    --request-timeout=4800
    data_dir/latte/s3_range_query.rn
  - >-
    latte run --function=full_scan --tag=latte-s3-full_scan --consistency=QUORUM --threads=1 --concurrency=24
    --duration=1
    --request-timeout=4800
    data_dir/latte/s3_range_query.rn
  - >-
    latte run --function=partition_scan --tag=latte-s3-partition_scan --consistency=QUORUM --threads=1 --concurrency=24
    --duration=60m --start-cycle=1 --end-cycle=40000001
    --request-timeout=4800
    data_dir/latte/s3_range_query.rn
  - >-
    latte run --function=partition_scan_lt --tag=latte-s3-partition_scan_lt --consistency=QUORUM --threads=1 --concurrency=24
    --duration=60m --start-cycle=1 --end-cycle=40000001
    --request-timeout=4800
    data_dir/latte/s3_range_query.rn
  - >-
    latte run --function=partition_scan_gt --tag=latte-s3-partition_scan_gt --consistency=QUORUM --threads=1 --concurrency=24
    --duration=60m --start-cycle=1 --end-cycle=40000001
    --request-timeout=4800
    data_dir/latte/s3_range_query.rn
  - >-
    latte run --function=partition_scan_range --tag=latte-s3-partition_scan_range --consistency=QUORUM --threads=1 --concurrency=24
    --duration=60m --start-cycle=1 --end-cycle=40000001
    --request-timeout=4800
    data_dir/latte/s3_range_query.rn
  - >-
    latte run --function=partition_group_by_ck --tag=latte-s3-partition_group_by_ck --consistency=QUORUM --threads=1 --concurrency=24
    --duration=60m --start-cycle=1 --end-cycle=40000001
    --request-timeout=4800
    data_dir/latte/s3_range_query.rn
  - >-
    latte run --function=partition_max_ck --tag=latte-s3-partition_max_ck --consistency=QUORUM --threads=1 --concurrency=24
    --duration=60m --start-cycle=1 --end-cycle=40000001
    --request-timeout=4800
    data_dir/latte/s3_range_query.rn
