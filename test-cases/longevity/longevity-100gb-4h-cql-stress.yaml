test_duration: 330

pre_create_keyspace: [
#  "CREATE KEYSPACE keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3} AND storage = {'type': 'S3', 'endpoint': 's3.us-east-1.amazonaws.com', 'bucket': 'manager-backup-tests-us-east-1'};",
  "CREATE KEYSPACE keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3};",
]

n_db_nodes: 6
n_loaders: 2
seeds_num: 3
simulated_racks: 3

instance_type_db: 'i4i.4xlarge'

nemesis_class_name: 'SisyphusMonkey'
#nemesis_class_name: 'NoOpMonkey'

user_prefix: 'longevity-100gb-4h'
space_node_threshold: 64424

server_encrypt: true
client_encrypt: true

pre_create_schema: True
sstable_size: 100

hinted_handoff: 'enabled'
parallel_node_operations: true

prepare_write_cmd:
  - >-
    cql-stress-cassandra-stress write cl=QUORUM n=20000000
    -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=SizeTieredCompactionStrategy)'
    -rate 'threads=80'
    -mode cql3 native
    -pop seq=1..20000000
    -col 'n=FIXED(10) size=FIXED(512)'
    -log interval=5
