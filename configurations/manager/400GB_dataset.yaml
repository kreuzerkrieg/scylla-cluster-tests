test_duration: 3000

"prepare_write_cmd": [
  "cassandra-stress write cl=QUORUM n=750000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native -rate threads=500 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..750000000",
  "cassandra-stress write cl=QUORUM n=750000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native -rate threads=500 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=750000001..1500000000",
  "cassandra-stress write cl=QUORUM n=750000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native -rate threads=500 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1500000001..2250000000",
  "cassandra-stress write cl=QUORUM n=750000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native -rate threads=500 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=2250000001..3000000000"
]

stress_cmd: [ "cassandra-stress read cl=QUORUM duration=60m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native  -rate threads=80 -col 'size=FIXED(1024) n=FIXED(1)'",
              "cassandra-stress read cl=QUORUM duration=60m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=1)' -mode cql3 native  -rate threads=80 -col 'size=FIXED(1024) n=FIXED(1)'" ]

instance_type_db: 'i7i.4xlarge'
instance_type_loader: 'c6i.8xlarge'
n_db_nodes: 1
n_loaders: 4
